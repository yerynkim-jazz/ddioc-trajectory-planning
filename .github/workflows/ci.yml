name: ci

on:
  push:
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++
        run: cmake -S cpp -B build/cpp
      - name: Build C++
        run: cmake --build build/cpp -j2
      - name: Test C++
        run: ctest --test-dir build/cpp --output-on-failure

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python
      - name: Run Python smoke tests
        run: PYTHONPATH=. python -m unittest discover -s python/tests -v