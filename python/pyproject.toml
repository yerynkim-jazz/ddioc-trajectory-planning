[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddioc-trajectory-planning"
version = "0.1.0"
description = "Python implementation of data-driven inverse optimal control research code for trajectory planning."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "casadi>=3.6,<4",
    "torch>=2.3,<3",
]

[project.optional-dependencies]
benchmark = [
    "cvxpy>=1.4,<2",
    "scikit-optimize>=0.10,<1",
    "pymoo>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ioc", "ioc.*"]